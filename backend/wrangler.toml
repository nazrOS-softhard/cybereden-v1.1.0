name = "cybereden-backend"
type = "service"
main = "src/worker.ts"
compatibility_date = "2025-05-26"
node_compat = true

[build]
command = "npm run build"
cwd = "."
main = "dist/worker.js"

[env.development]
vars = { ENVIRONMENT = "development", API_URL = "http://localhost:8787" }

[env.production]
name = "cybereden-backend-prod"
routes = [{ pattern = "api.cybereden.com/*", zone_name = "cybereden.com" }]
vars = { ENVIRONMENT = "production", API_URL = "https://api.cybereden.com" }

[[d1_databases]]
binding = "DB"
database_name = "cybereden-db"
database_id = "REPLACE_WITH_YOUR_D1_ID"
preview_database_id = "REPLACE_WITH_YOUR_PREVIEW_ID"

[[r2_buckets]]
binding = "R2_AVATARS"
bucket_name = "cybereden-avatars"
preview_bucket_name = "cybereden-avatars-preview"

[[r2_buckets]]
binding = "R2_ASSETS"
bucket_name = "cybereden-assets"
preview_bucket_name = "cybereden-assets-preview"

[[kv_namespaces]]
binding = "AUTH_CACHE"
id = "REPLACE_WITH_YOUR_KV_ID"
preview_id = "REPLACE_WITH_YOUR_KV_PREVIEW_ID"

[vars]
GITHUB_CLIENT_ID = "your_github_client_id"
GITHUB_CLIENT_SECRET = "your_github_client_secret"
TWITCH_CLIENT_ID = "your_twitch_client_id"
TWITCH_CLIENT_SECRET = "your_twitch_client_secret"
JWT_SECRET = "your_jwt_secret_key"
CORS_ORIGINS = "http://localhost:5173,https://cybereden.com"
