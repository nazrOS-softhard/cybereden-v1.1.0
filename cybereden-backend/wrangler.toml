name = "cybereden-backend"
type = "service"
main = "src/worker.ts"
compatibility_date = "2025-05-26"

# ==================== ENVIRONMENTS ====================
[env.development]
vars = { ENVIRONMENT = "development", API_URL = "http://localhost:8787" }

[env.production]
vars = { ENVIRONMENT = "production", API_URL = "https://api.cybereden.com" }

# ==================== D1 DATABASE ====================
[[d1_databases]]
binding = "DB"
database_name = "cybereden-db"
database_id = "1e1c153e-9c2e-41cd-96e2-8d57fa835957"
preview_database_id = "1e1c153e-9c2e-41cd-96e2-8d57fa835957"

# ==================== R2 BUCKET ====================
[[r2_buckets]]
binding = "R2_AVATARS"
bucket_name = "cybereden-avatars"
preview_bucket_name = "cybereden-avatars-preview"

[[r2_buckets]]
binding = "R2_ASSETS"
bucket_name = "cybereden-assets"
preview_bucket_name = "cybereden-assets-preview"

# ==================== KV (для кэширования токенов) ====================
[[kv_namespaces]]
binding = "AUTH_CACHE"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_KV_PREVIEW_NAMESPACE_ID"

# ==================== ROUTES ====================
[env.production]
routes = [
  { pattern = "api.cybereden.com/*", zone_name = "cybereden.com" }
]

# ==================== BUILD ====================
[build]
command = "npm run build"
cwd = "."
watch_paths = ["src/**/*.ts"]

[build.upload]
format = "service-worker"
main = "./dist/worker.js"

# ==================== OBSERVABILITY ====================
[observability]
enabled = true

# ==================== ENV VARS (заполнить вручную после создания приложений OAuth) ====================
[vars]
GITHUB_CLIENT_ID = ""
GITHUB_CLIENT_SECRET = ""
TWITCH_CLIENT_ID = ""
TWITCH_CLIENT_SECRET = ""
JWT_SECRET = ""
R2_ACCOUNT_ID = ""
R2_ACCESS_KEY_ID = ""
R2_SECRET_ACCESS_KEY = ""
CORS_ORIGINS = "http://localhost:5173,http://localhost:3000,https://cybereden.com"
